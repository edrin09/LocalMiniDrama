<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; overflow: hidden; }
      body {
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: #0d0b1f;
        color: #fff;
        position: relative;
      }
      .glow {
        position: absolute;
        width: 900px; height: 900px;
        left: -260px; top: -360px;
        background: radial-gradient(circle, rgba(124, 92, 255, 0.55), rgba(124, 92, 255, 0) 62%);
      }
      .glow2 {
        position: absolute;
        width: 700px; height: 700px;
        right: -180px; bottom: -320px;
        background: radial-gradient(circle, rgba(64, 196, 255, 0.35), rgba(64, 196, 255, 0) 65%);
      }
      .inner { position: relative; display: flex; height: 100%; padding: 64px 56px 64px 72px; }
      .left { width: 610px; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
      .logo {
        width: 46px; height: 46px; border-radius: 12px;
        background: linear-gradient(135deg, #8b6cff, #5a3cf0);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
      }
      .brand span { font-size: 19px; letter-spacing: 3px; color: #b9b3e0; }
      h1 { font-size: 64px; line-height: 1.12; letter-spacing: -1px; font-weight: 800; }
      h1 em {
        font-style: normal;
        background: linear-gradient(100deg, #a98bff, #57d0ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub { margin-top: 22px; font-size: 22px; line-height: 1.6; color: #c7c2e6; }
      .flow { margin-top: 34px; font-size: 15px; color: #8e88b8; line-height: 1.9; letter-spacing: 0.3px; }
      .tags { margin-top: 30px; display: flex; gap: 10px; }
      .tag {
        font-size: 14px; padding: 7px 14px; border-radius: 999px;
        border: 1px solid rgba(169, 139, 255, 0.45);
        color: #cfc6ff; background: rgba(124, 92, 255, 0.12);
      }
      .right { flex: 1; display: flex; align-items: center; justify-content: center; }
      .frame {
        width: 452px; height: 500px; border-radius: 16px; overflow: hidden;
        border: 1px solid rgba(169, 139, 255, 0.35);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        transform: rotate(-3deg);
      }
      .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="inner">
      <div class="left">
        <div class="brand"><div class="logo">🎬</div><span>LOCALMINIDRAMA</span></div>
        <h1>本地 <em>AI 漫剧</em><br />生产流水线</h1>
        <p class="sub">一段剧本进去，一条竖屏短剧出来。<br />数据不出本机。</p>
        <p class="flow">剧本拆解 → 角色设定 → 分镜首尾帧 → 图生视频 → 方言配音 → ffmpeg 成片</p>
        <div class="tags">
          <div class="tag">Vue 3</div>
          <div class="tag">NestJS</div>
          <div class="tag">SQLite</div>
          <div class="tag">ffmpeg</div>
          <div class="tag">MIT</div>
        </div>
      </div>
      <div class="right">
        <div class="frame"><img src="screenshots/03-episode-edit.png" alt="preview" /></div>
      </div>
    </div>
  </body>
</html>
